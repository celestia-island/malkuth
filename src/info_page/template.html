<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="10">
<title>{{ title }}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0e0e1e;
    color: #d4d4e8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.6;
    padding: 2rem;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 2.5rem 2rem;
    text-align: center;
    backdrop-filter: blur(12px);
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 1rem;
    opacity: 0.8;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    color: #ffffff;
  }
  .tagline {
    font-size: 0.875rem;
    color: rgba(212, 212, 232, 0.6);
    margin-bottom: 1.5rem;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 9999px;
    font-size: 0.8125rem;
    font-weight: 600;
    margin-bottom: 1.25rem;
  }
  .status--ready {
    background: rgba(46, 213, 115, 0.12);
    color: #2ed573;
  }
  .status--working {
    background: rgba(255, 165, 0, 0.12);
    color: #ffa500;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status--ready .status-dot { background: #2ed573; }
  .status--working .status-dot { background: #ffa500; }
  .info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 0.8125rem;
  }
  .info-row:last-of-type { border-bottom: none; }
  .info-label {
    color: rgba(212, 212, 232, 0.5);
  }
  .info-value {
    color: #d4d4e8;
    font-weight: 500;
    font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
  }
  .retry-hint {
    margin-top: 1.25rem;
    font-size: 0.75rem;
    color: rgba(212, 212, 232, 0.4);
  }
  .footer {
    margin-top: 1.5rem;
    font-size: 0.6875rem;
    color: rgba(212, 212, 232, 0.25);
  }
  .pulse-ring {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ffa500;
    opacity: 0.3;
    animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
  }
  @keyframes ping {
    0% { transform: scale(1); opacity: 0.3; }
    75%, 100% { transform: scale(2.5); opacity: 0; }
  }
</style>
</head>
<body>
<div class="card">
  {% if logo_base64 %}
  <img class="logo" src="data:image/webp;base64,{{ logo_base64 }}" alt="Malkuth" />
  {% else %}
  <svg class="logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="32" cy="32" r="28" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <circle cx="32" cy="32" r="8" fill="rgba(255,255,255,0.7)"/>
    <line x1="32" y1="4" x2="32" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <line x1="56" y1="18" x2="44" y2="26" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="56" y1="46" x2="44" y2="38" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="8" y1="18" x2="20" y2="26" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="8" y1="46" x2="20" y2="38" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="32" y1="60" x2="32" y2="44" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  </svg>
  {% endif %}
  <h1>{{ heading }}</h1>
  <p class="tagline">{{ tagline }}</p>
  <div class="status {% if ready %}status--ready{% else %}status--working{% endif %}">
    {% if ready %}
    <span class="status-dot"></span>
    {% else %}
    <span class="pulse-ring"></span>
    {% endif %}
    <span>{{ status_text }}</span>
  </div>
  <div class="info-row">
    <span class="info-label">{{ version_label }}</span>
    <span class="info-value">{{ version }}</span>
  </div>
  <div class="info-row">
    <span class="info-label">{{ task_label }}</span>
    <span class="info-value">{{ task }}</span>
  </div>
  <p class="retry-hint">{{ retry }}</p>
  <p class="footer">{{ footer }}</p>
</div>
</body>
</html>
