<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<style>
  :root {
    --bg: #0e0e1e;
    --fg: #d4d4e8;
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.08);
    --heading: #ffffff;
    --tagline: rgba(212, 212, 232, 0.6);
    --label: rgba(212, 212, 232, 0.5);
    --value: #d4d4e8;
    --divider: rgba(255, 255, 255, 0.05);
    --retry: rgba(212, 212, 232, 0.4);
    --footer: rgba(212, 212, 232, 0.25);
    --footer-hover: rgba(212, 212, 232, 0.55);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f5f0;
      --fg: #333340;
      --card-bg: rgba(255, 255, 255, 0.8);
      --card-border: rgba(0, 0, 0, 0.08);
      --heading: #1a1a2e;
      --tagline: rgba(30, 30, 50, 0.5);
      --label: rgba(30, 30, 50, 0.45);
      --value: #333340;
      --divider: rgba(0, 0, 0, 0.05);
      --retry: rgba(30, 30, 50, 0.35);
      --footer: rgba(30, 30, 50, 0.2);
      --footer-hover: rgba(30, 30, 50, 0.5);
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.6;
    padding: 2rem;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 2.5rem 2rem;
    text-align: center;
    backdrop-filter: blur(12px);
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 1rem;
    opacity: 0.8;
    display: block;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    color: var(--heading);
  }
  .tagline {
    font-size: 0.875rem;
    color: var(--tagline);
    margin-bottom: 1.5rem;
  }
  .status {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 9999px;
    font-size: 0.8125rem;
    font-weight: 600;
    margin-bottom: 1.25rem;
    text-align: center;
  }
  .status--ready {
    background: rgba(46, 213, 115, 0.12);
    color: #2ed573;
  }
  .status--working {
    background: rgba(255, 165, 0, 0.12);
    color: #ffa500;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status--ready .status-dot { background: #2ed573; }
  .status--working .status-dot { background: #ffa500; animation: pulse 2s ease-in-out infinite; }
  .info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--divider);
    font-size: 0.8125rem;
  }
  .info-row:last-of-type { border-bottom: none; }
  .info-label { color: var(--label); }
  .info-value {
    color: var(--value);
    font-weight: 500;
    font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
  }
  .retry-hint {
    margin-top: 1.25rem;
    font-size: 0.75rem;
    color: var(--retry);
    line-height: 1.8;
  }
  .countdown {
    font-weight: 700;
    font-size: 1.5em;
    color: var(--countdown-color, #2ed573);
    margin-left: 4px;
  }
  .footer {
    margin-top: 1.5rem;
    font-size: 0.6875rem;
    color: var(--footer);
  }
  .footer a {
    color: inherit;
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .footer a:hover { color: var(--footer-hover); }
</style>
</head>
<body>
<div class="card">
  {% if logo_base64 %}
  <img class="logo" src="data:image/webp;base64,{{ logo_base64 }}" alt="Malkuth" />
  {% endif %}
  <h1>{{ heading }}</h1>
  <p class="tagline">{{ tagline }}</p>
  <div class="status {% if ready %}status--ready{% else %}status--working{% endif %}">
    <span class="status-dot"></span>
    <span>{{ status_text }}</span>
  </div>
  <div class="info-row">
    <span class="info-label">{{ version_label }}</span>
    <span class="info-value">{{ version }}</span>
  </div>
  <div class="info-row">
    <span class="info-label">{{ task_label }}</span>
    <span class="info-value">{{ task }}</span>
  </div>
  <p class="retry-hint">{{ retry }} <span class="countdown" id="countdown" style="--countdown-color: {% if ready %}#2ed573{% else %}#ffa500{% endif %}">10s</span></p>
  <p class="footer"><a href="https://github.com/celestia-island/malkuth" target="_blank" rel="noopener">{{ footer }}</a></p>
</div>
<script>
(function(){var s=10;var e=document.getElementById("countdown");function t(){if(s<=0){location.reload();return}e.textContent=s+"s";s--;setTimeout(t,1000);}t();})();
</script>
</body>
</html>
