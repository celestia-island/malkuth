[package]
name = "malkuth"
description = "A composable service-supervision toolkit for Rust"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["langyo <langyo.china@gmail.com>"]
license-file = "LICENSE"
repository = "https://github.com/celestia-island/malkuth"
readme = "README.md"
keywords = ["supervisor", "graceful-shutdown", "rolling-update", "jsonrpc", "socket-activation"]
categories = ["asynchronous", "network-programming", "development-tools"]
publish = true
exclude = ["docs/", "scripts/", ".github/", "justfile", "rust-toolchain.toml"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["tcp", "signals"]

# ── JSON-RPC transports ────────────────────────────────────────
tcp = []
ws = ["dep:tokio-tungstenite"]
ipc = ["dep:interprocess"]

# ── default facilities ─────────────────────────────────────────
signals = []
worker = []
probes = ["dep:axum"]

# ── CoordinationLock backends ──────────────────────────────────
file-lock = []
lease = []
pg-lock = ["dep:tokio-postgres"]

# ── fault-tolerance strategy ───────────────────────────────────
replica = []
leader-follower = ["lease"]

# ── schema generation ──────────────────────────────────────────
schema = ["dep:schemars"]

# ── CLI binary ─────────────────────────────────────────────────
cli = ["dep:clap", "dep:notify", "dep:tracing-subscriber", "dep:chrono", "dep:toml", "dep:axum", "dep:tera", "dep:sha2", "dep:reqwest", "dep:rustls", "dep:kou", "dep:hyper", "dep:hyper-util"]

# ── MCP server ─────────────────────────────────────────────────
# Standalone MCP (Model Context Protocol) server exposing supervision + probe
# tools over stdio. Pulls in rmcp + reqwest (for the probe tool).
mcp = ["dep:rmcp", "schema", "worker", "dep:reqwest", "dep:rustls", "tokio/io-std"]

[[bin]]
name = "malkuth"
required-features = ["cli"]

[dependencies]
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
schemars = { version = "^1", features = ["derive"], optional = true }
thiserror = "^2"
async-trait = "^0.1"
tracing = "^0.1"
futures-util = { version = "^0.3", features = ["io"] }
tokio = { version = "^1", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util", "fs"] }

tokio-tungstenite = { version = "^0.29", optional = true }
interprocess = { version = "^2", optional = true, features = ["tokio"] }
axum = { version = "^0.8", optional = true }
# Raw HTTP/1.1 upgrade support for the `--serve` proxy tunnel (the `OnUpgrade`
# extension type plus the upgraded stream bridge). axum 0.8 no longer
# re-exports `axum::hyper`, so hyper is a direct dependency; only the
# always-on `upgrade` module types are used.
hyper = { version = "^1", optional = true }
hyper-util = { version = "^0.1", optional = true, features = ["tokio"] }
tera = { version = "^2", optional = true }
tokio-postgres = { version = "^0.7", optional = true }

# CLI-only deps
clap = { version = "^4", features = ["derive"], optional = true }
notify = { version = "^8", optional = true }
tracing-subscriber = { version = "^0.3", optional = true, features = ["env-filter"] }
chrono = { version = "^0.4", optional = true }
toml = { version = "^1", optional = true }
sha2 = { version = "^0.11", optional = true }

# MCP (optional, for standalone MCP server)
rmcp = { version = "^1", optional = true, features = ["server", "transport-io", "macros"] }
# HTTP client for the probe tool (healthz/readyz checks).
# `rustls-no-provider` keeps the pure-Rust ring provider (below) instead of
# pulling aws-lc-sys, which needs NASM/CMake and is banned by deny.toml.
reqwest = { version = "^0.13", optional = true, default-features = false, features = ["rustls-no-provider"] }
# The single crypto provider for every rustls user in the binary (reqwest,
# kou, rustls-platform-verifier). One provider feature, so rustls resolves it
# as the process default without an explicit install call.
rustls = { version = "^0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
kou = { version = "^0.1", optional = true }


regex = { version = "^1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "^0.2"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Console", "Win32_System_IO", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "^1", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util", "fs"] }
criterion = { version = "^0.5", features = ["async_tokio"] }

[[bench]]
name = "rpc"
harness = false
required-features = ["tcp"]

[[bench]]
name = "proxy"
harness = false
required-features = ["tcp"]

[[example]]
name = "test_app"
required-features = ["tcp", "worker", "signals"]

[[example]]
name = "minimal_server"
required-features = ["tcp", "signals"]

[[example]]
name = "supervised_workers"
required-features = ["worker"]

[[example]]
name = "coordination_lock"
required-features = ["file-lock", "lease"]

[profile.release]
opt-level = 3
lto = "thin"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
