name: npm Release

# Publish the `malkuth` binary to npm as precompiled platform subpackages so
# users can run it via `npx @celestia-island/malkuth` with no Rust toolchain.
#
# This pipeline is the npm counterpart to publish.yml (crates.io). It runs in
# three phases:
#
#   1. `build-subpackage` (matrix, one job per platform) — cross-compile the
#      binary with the `cli mcp` features (so both the watchdog CLI and
#      `malkuth mcp` are available), stage it into a platform subpackage via
#      celestia-devtools `npm-dist`, and publish that single subpackage to npm.
#   2. `publish-root` (single job, fan-in) — with no binary of its own, re-run
#      `npm-dist` to (re)assemble the root package listing every subpackage
#      already on npm, then publish the root launcher.
#
# The version is derived from the pushed tag (vX.Y.Z → X.Y.Z) and is shared by
# the root package and every subpackage so they are released in lockstep.
#
# The Linux lane is static musl for both CPU classes, published under the
# generic `-linux-x64` / `-linux-arm64` names: one artifact per CPU class with
# no glibc floor, running unchanged on Debian/Ubuntu/Alpine/distroless hosts.
# The macOS and Windows binaries are native; Windows ships as the
# `-win32-x64` MSVC subpackage and runs the daemon as a service.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0), without leading v"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build-subpackage:
    name: Build + publish @celestia-island/malkuth${{ matrix.suffix }} to npm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  platform: x86_64-unknown-linux-gnu,  suffix: -linux-x64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, platform: aarch64-unknown-linux-gnu, suffix: -linux-arm64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,      platform: aarch64-apple-darwin,    suffix: -darwin-arm64 }
          - { os: macos-latest,       target: x86_64-apple-darwin,       platform: x86_64-apple-darwin,       suffix: -darwin-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    platform: x86_64-pc-windows-msvc,    suffix: -win32-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install celestia-devtools
        run: pip install git+https://github.com/celestia-island/celestia-devtools.git

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publishing $v"

      # Static musl is the only Linux lane that does not pin a glibc floor:
      # zig supplies the cross linker for both x86_64 and aarch64 musl.
      - name: Install zig + cargo-zigbuild
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Build (release)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo zigbuild --release --features "cli mcp" --target ${{ matrix.target }}
          else
            cargo build --release --features "cli mcp" --target ${{ matrix.target }}
          fi

      - name: Stage subpackage
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/malkuth"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="${bin}.exe"; fi
          # The Linux binary is built for musl but published under the generic
          # platform name: one static artifact per CPU class, no -musl twin and
          # no glibc variant. `platform` only selects the os/cpu/suffix mapping.
          celestia-devtools npm-dist \
            --name malkuth \
            --version "${{ steps.ver.outputs.version }}" \
            --binary "$bin" \
            --rust-target "${{ matrix.platform }}" \
            --out-dir dist \
            --description "Composable service-supervision toolkit — watchdog + MCP server (npx launcher)" \
            --repository "https://github.com/celestia-island/malkuth" \
            --homepage "https://github.com/celestia-island/malkuth"

      - name: Upload staged subpackage
        uses: actions/upload-artifact@v4
        with:
          name: subpackage-${{ matrix.suffix }}
          path: dist/malkuth${{ matrix.suffix }}
          retention-days: 7

      - name: Publish subpackage
        shell: bash
        run: |
          sub="dist/malkuth${{ matrix.suffix }}"
          echo "::group::npm pack $sub"
          (cd "$sub" && npm pack --dry-run)
          echo "::endgroup::"
          set +e
          (cd "$sub" && npm publish --access public --provenance 2>&1 | tee /tmp/npm-publish.log)
          status=$?
          set -e
          if grep -q "previously published" /tmp/npm-publish.log; then
            echo "Already published by another job, ok"
            exit 0
          fi
          exit "$status"

  publish-root:
    name: Publish root @celestia-island/malkuth to npm
    needs: build-subpackage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install celestia-devtools
        run: pip install git+https://github.com/celestia-island/celestia-devtools.git

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Assemble root package
        run: |
          for sfx in -linux-x64 -linux-arm64 -darwin-arm64 -darwin-x64 -win32-x64; do
            mkdir -p "dist/malkuth${sfx}"
          done
          celestia-devtools npm-dist \
            --name malkuth \
            --version "${{ steps.ver.outputs.version }}" \
            --out-dir dist \
            --description "Composable service-supervision toolkit — watchdog + MCP server (npx launcher)" \
            --repository "https://github.com/celestia-island/malkuth" \
            --homepage "https://github.com/celestia-island/malkuth"

      - name: Publish root package
        run: |
          echo "::group::npm pack (root)"
          (cd dist && npm pack --dry-run)
          echo "::endgroup::"
          set +e
          (cd dist && npm publish --access public --provenance 2>&1 | tee /tmp/npm-publish-root.log)
          status=$?
          set -e
          if grep -q "previously published" /tmp/npm-publish-root.log; then
            echo "Already published by another job, ok"
            exit 0
          fi
          exit "$status"
